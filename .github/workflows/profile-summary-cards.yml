name: Profile Summary Cards

concurrency:
  group: profile-summary-cards-main
  cancel-in-progress: false

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      STREAK_SVG_PATH: profile-summary-card-output/tokyonight/5-streak.svg
      ACTIVITY_GRAPH_SVG_PATH: profile-summary-card-output/tokyonight/6-activity-graph.svg

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Generate stats and language SVGs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: ${{ github.repository_owner }}
        run: node scripts/generate-profile-stats.mjs

      - name: Mirror streak and activity graph SVGs
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$(dirname "$STREAK_SVG_PATH")"

          rm -f \
            profile-summary-card-output/tokyonight/0-profile-details.svg \
            profile-summary-card-output/tokyonight/2-most-commit-language.svg \
            profile-summary-card-output/tokyonight/4-productive-time.svg \
            profile-summary-card-output/tokyonight/README.md

          curl -fsSL "https://streak-stats.demolab.com?user=${{ github.repository_owner }}&theme=tokyonight&hide_border=true&background=1a1b27" -o streak.tmp.svg
          if grep -q "<svg" streak.tmp.svg; then
            mv streak.tmp.svg "$STREAK_SVG_PATH"
          else
            rm -f streak.tmp.svg
            echo "Fetched streak asset is not a valid SVG"
            exit 1
          fi

          curl -fsSL "https://github-readme-activity-graph.vercel.app/graph?username=${{ github.repository_owner }}&theme=tokyo-night&hide_border=true&bg_color=1a1b27&color=70a5fd&line=bf91f3&point=38bdae" -o activity-graph.tmp.svg
          if grep -q "<svg" activity-graph.tmp.svg; then
            mv activity-graph.tmp.svg "$ACTIVITY_GRAPH_SVG_PATH"
          else
            rm -f activity-graph.tmp.svg
            echo "Fetched activity graph asset is not a valid SVG"
            exit 1
          fi

      - name: Commit generated profile SVG assets when changed
        shell: bash
        run: |
          set -euo pipefail

          git add profile-summary-card-output

          if git diff --cached --quiet -- profile-summary-card-output; then
            echo "No generated profile SVG changes to commit"
            exit 0
          fi

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "chore: refresh generated profile SVG assets"
          git pull --rebase origin main
          git push
