name: SVGs

concurrency:
  group: profile-svgs-main
  cancel-in-progress: false

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      OUT_DIR: profile-summary-card-output/tokyonight
      STREAK_SVG: profile-summary-card-output/tokyonight/5-streak.svg
      GRAPH_SVG: profile-summary-card-output/tokyonight/6-activity-graph.svg

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Node
        uses: actions/setup-node@v6.3.0
        with:
          node-version: 24

      - name: Build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: ${{ github.repository_owner }}
        run: node scripts/generate-profile-stats.mjs

      - name: Sync
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$OUT_DIR"

          rm -f \
            "$OUT_DIR/0-profile-details.svg" \
            "$OUT_DIR/2-most-commit-language.svg" \
            "$OUT_DIR/4-productive-time.svg" \
            "$OUT_DIR/README.md"

          curl -fsSL "https://streak-stats.demolab.com?user=${{ github.repository_owner }}&theme=tokyonight&hide_border=true&background=1a1b27" -o streak.tmp.svg
          if grep -q "<svg" streak.tmp.svg; then
            mv streak.tmp.svg "$STREAK_SVG"
          else
            rm -f streak.tmp.svg
            echo "Fetched streak asset is not a valid SVG"
            exit 1
          fi

          curl -fsSL "https://github-readme-activity-graph.vercel.app/graph?username=${{ github.repository_owner }}&theme=tokyo-night&hide_border=true&bg_color=1a1b27&color=70a5fd&line=bf91f3&point=38bdae" -o graph.tmp.svg
          if grep -q "<svg" graph.tmp.svg; then
            mv graph.tmp.svg "$GRAPH_SVG"
          else
            rm -f graph.tmp.svg
            echo "Fetched activity graph asset is not a valid SVG"
            exit 1
          fi

      - name: Push
        shell: bash
        run: |
          set -euo pipefail

          git add "$OUT_DIR"

          if git diff --cached --quiet -- "$OUT_DIR"; then
            echo "No generated profile SVG changes to commit"
            exit 0
          fi

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "chore: refresh generated profile SVG assets"
          git pull --rebase origin main
          git push
