name: SVGs

concurrency:
  group: profile-svgs-main
  cancel-in-progress: false

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      OUT_DIR: profile-summary-card-output/tokyonight

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Node
        uses: actions/setup-node@v6.3.0
        with:
          node-version: 24

      - name: Build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: ${{ github.repository_owner }}
        run: node scripts/generate-profile-stats.mjs

      - name: Cleanup
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$OUT_DIR"

          rm -f \
            "$OUT_DIR/0-profile-details.svg" \
            "$OUT_DIR/2-most-commit-language.svg" \
            "$OUT_DIR/4-productive-time.svg" \
            "$OUT_DIR/README.md"

      - name: Push
        shell: bash
        run: |
          set -euo pipefail

          git add "$OUT_DIR"

          if git diff --cached --quiet -- "$OUT_DIR"; then
            echo "No generated profile SVG changes to commit"
            exit 0
          fi

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "chore: refresh generated profile SVG assets"
          git pull --rebase origin main
          git push
